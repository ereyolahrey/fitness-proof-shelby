services:
  - type: web
    name: fitness-proof
    runtime: node
    buildCommand: npm install
    startCommand: node api/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: shelby
      - key: SHELBY_PRIVATE_KEY
        sync: false
      - key: SHELBY_ACCOUNT_ADDRESS
        sync: false
      - key: SHELBY_API_KEY
        sync: false
